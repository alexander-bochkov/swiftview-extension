name: Pull Request Check

run-name: "Pull Request #${{ github.event.pull_request.number }} (${{github.event.pull_request.title}})"

on:
  pull_request:

jobs:
  biome:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Check
        run: biome ci
  commitlint:
    name: Commit Message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Packages
        run: npm install --save-dev @commitlint/cli
      - name: Check
        run: npx --no -- commitlint --default-config --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
