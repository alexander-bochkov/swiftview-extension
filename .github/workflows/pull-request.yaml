name: Pull Request

run-name: "Pull Request #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})"

on:
  pull_request:

# A new push to the pull request cancels the run of the previous one.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Up
        uses: ./.github/actions/setup
      - name: Lint
        run: npx --no -- biome ci
      - name: Lint Commit Messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --default-config --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7
      - name: Set Up
        uses: ./.github/actions/setup
      - name: Test
        run: npx --no -- vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7
      - name: Set Up
        uses: ./.github/actions/setup
      - name: Check Types
        run: npx --no -- tsc
      - name: Build
        run: npx --no -- wxt build
      - name: Build Storybook
        run: npx --no -- storybook build --quiet
